# Optional convenience wrapper. The start scripts use `docker run` directly;
# this file is here for users who prefer `docker compose up`. See PLAN.md §11.

services:
  finally:
    build:
      context: .
      dockerfile: Dockerfile
    image: finally:latest
    container_name: finally
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./db:/app/db
    restart: unless-stopped
